<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 디딤돌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design system — Modern EdTech SaaS
   한 가지 밝은 테마. 무채색 바탕 위에 인디고(주요 행동)와 스카이(보조 강조)만 절제해서 사용.
   레이아웃: 1200px 컨테이너(1440 화면 기준), 읽는 화면은 760px 본문 + 280px 사이드바 */
:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --text: #111827;
  --muted: #64748B;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;
  --subtle: #F1F5F9;
  --brand: #4F46E5;
  --brand-hover: #4338CA;
  --brand-50: #EEF2FF;
  --brand-100: #E0E7FF;
  --brand-200: #C7D2FE;
  --accent: #0EA5E9;
  --accent-50: #F0F9FF;
  --accent-700: #0369A1;
  --good: #15803D; --good-50: #F0FDF4; --good-200: #BBF7D0;
  --bad: #DC2626; --bad-50: #FEF2F2; --bad-200: #FECACA;
  --font: "Pretendard Variable", Pretendard, Inter, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 12px;
  --r-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04);
  --shadow-md: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px -8px rgba(15, 23, 42, .10);
  --scale: 1;
  --container: 1200px;
  color-scheme: light;
}
:root[data-fs="2"] { --scale: 1.12; }
:root[data-fs="3"] { --scale: 1.25; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: calc(17px * var(--scale)); line-height: 1.65;
  letter-spacing: -0.011em; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { margin: 0; color: var(--text); letter-spacing: -0.025em; line-height: 1.3; text-wrap: balance; }
h1 { font-size: 2em; font-weight: 700; }
h2 { font-size: 1.32em; font-weight: 700; }
h3 { font-size: 1.08em; font-weight: 600; }
p { margin: 0; }
a { color: var(--brand); text-decoration: none; }
img { max-width: 100%; height: auto; display: block; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.container { max-width: var(--container); margin: 0 auto; padding: 0 32px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .88em; }
.stack { display: grid; gap: 12px; }
@media (max-width: 767px) { .container { padding: 0 20px; } .btn { min-height: 52px; } .btn.lg { min-height: 56px; } }

/* ── Header (px 고정: 글자 크기를 키워도 메뉴 줄이 흐트러지지 않게) ── */
.header { position: sticky; top: 0; z-index: 30; background: rgba(255, 255, 255, .9); backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--line); }
.header-in { height: 68px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
.logo { justify-self: start; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; color: var(--text); font-size: 17px; line-height: 1; }
.logo-mark { width: 30px; height: 30px; flex: none; }
.logo-text { font-weight: 700; letter-spacing: -0.03em; }
.logo-ui { width: 38px; height: 38px; flex: none; border-radius: 50%; }
.logo-tag { display: grid; gap: 3px; text-align: left; font-size: 12.5px; font-weight: 600; line-height: 1.15; color: #334155; padding: 1px 14px 1px 0; border-right: 1px solid var(--line-strong, #CBD5E1); margin-right: 4px; }
.mainnav { display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--subtle); border: 1px solid var(--line); border-radius: 12px; }
.mainnav button { border: 0; background: none; color: var(--muted); font-weight: 500; font-size: 15px; line-height: 1; padding: 0 16px; height: 36px; border-radius: 8px; transition: color .15s, background .15s; }
.mainnav button:hover { color: var(--text); }
.mainnav button[aria-current="page"] { color: var(--text); font-weight: 600; background: var(--surface); box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 0 0 1px var(--line); }
.header-right { justify-self: end; display: flex; align-items: center; gap: 12px; }
.fs { display: flex; align-items: center; gap: 10px; }
.fs-label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
.fs-label svg.i { width: 16px; height: 16px; }
.seg { display: inline-flex; background: var(--subtle); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--muted); border-radius: 8px; min-width: 40px; height: 36px; padding: 0 12px; font-weight: 600; line-height: 1; font-size: 15px; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 0 0 1px var(--line); }
.fs .seg button:nth-child(1) { font-size: 13px; }
.fs .seg button:nth-child(2) { font-size: 16px; }
.fs .seg button:nth-child(3) { font-size: 19px; }
@media (max-width: 1100px) { .logo-tag, .logo-ui { display: none; } }
@media (max-width: 899px) { .header-in { grid-template-columns: 1fr auto; height: 64px; } .mainnav { display: none; } }
@media (max-width: 520px) { .fs-label { display: none; } .seg button { min-width: 44px; height: 40px; } }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 10px; border: 1px solid var(--brand); background: var(--brand); color: #fff; font-weight: 600; font-size: .95em; line-height: 1.2; text-align: center; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
.btn:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.btn.secondary:hover { background: var(--subtle); border-color: var(--line-strong); }
.btn.lg { min-height: 56px; padding: 0 26px; font-size: 1em; }
.btn.block { width: 100%; }
.btn.good { background: var(--good); border-color: var(--good); }
.btn.good:hover { background: #166534; border-color: #166534; }
.btn.bad { background: var(--surface); color: var(--bad); border-color: var(--bad-200); }
.btn.bad:hover { background: var(--bad-50); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg.i { width: 18px; height: 18px; }
.link { display: inline-flex; align-items: center; gap: 4px; color: var(--brand); font-weight: 600; font-size: .9em; }
.link svg.i { width: 16px; height: 16px; transition: transform .15s; }

/* ── Common pieces ── */
main { padding: 0 0 96px; }
.page { padding-top: 40px; }
.page-head { display: grid; gap: 8px; margin-bottom: 28px; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 600; font-size: .88em; letter-spacing: 0; }
.page-head h1 { font-size: 2em; font-weight: 700; letter-spacing: -0.03em; }
.page-head p { color: var(--muted); max-width: 640px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .88em; color: var(--muted); margin-bottom: 16px; }
.crumbs button { border: 0; background: none; padding: 4px 0; color: var(--muted); font-weight: 500; }
.crumbs button:hover { color: var(--text); }
.crumbs svg.i { width: 14px; height: 14px; color: var(--line-strong); }
.crumbs span { color: var(--text); font-weight: 500; }
.section { margin-top: 56px; }
.home-sec { margin-top: 88px; }
@media (max-width: 767px) { .home-sec { margin-top: 56px; } }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.section-head p { color: var(--muted); font-size: .96em; margin-top: 6px; }
.home-sec .section-head { margin-bottom: 32px; }
.home-sec .section-head h2 { font-size: 1.7em; font-weight: 700; letter-spacing: -0.035em; margin-top: 8px; }
.sec-ey { display: block; color: var(--brand); font-weight: 600; font-size: .88em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow-sm); }
.ichip { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-50); color: var(--brand); flex: none; }
.ichip svg.i { width: 20px; height: 20px; }
.ichip.sm { width: 32px; height: 32px; border-radius: 8px; }
.ichip.sm svg.i { width: 17px; height: 17px; }
.ichip.sky { background: var(--accent-50); color: var(--accent-700); }
.ichip.plain { background: var(--subtle); color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: .84em; font-weight: 500; line-height: 1.5; white-space: nowrap; }
.badge svg.i { width: 14px; height: 14px; }
.badge.brand { background: var(--brand-50); border-color: var(--brand-100); color: var(--brand); }
.badge.good { background: var(--good-50); border-color: var(--good-200); color: var(--good); }
.hover-lift { transition: border-color .18s, box-shadow .18s, transform .18s; }
.hover-lift:hover { border-color: var(--brand-200); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.hover-lift:hover .link svg.i, .hover-lift:hover .go svg.i { transform: translateX(3px); }
@media (prefers-reduced-motion: reduce) { .hover-lift, .hover-lift:hover { transition: none; transform: none; } }

/* ── Hero ── */
.hero { padding: 88px 0 8px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 72px; align-items: center; }
.hero-copy { display: flex; flex-direction: column; align-items: flex-start; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 5px; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 28px; }
.hero-badge b { background: var(--brand-50); color: var(--brand); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
.hero h1 { font-size: calc(var(--scale) * clamp(38px, 3.9vw, 56px)); font-weight: 800; line-height: 1.14; letter-spacing: -0.045em; margin-bottom: 24px; }
.hero h1 em { font-style: normal; color: var(--brand); }
.hero .lead { font-size: 1.1em; color: var(--muted); line-height: 1.75; max-width: 500px; margin-bottom: 40px; }
.hero .lead strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 6px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 10px 24px; color: var(--muted); font-size: 15px; padding-top: 24px; border-top: 1px solid var(--line); width: 100%; max-width: 500px; }
.hero-meta span { display: inline-flex; align-items: center; gap: 8px; }
.hero-meta svg.i { width: 17px; height: 17px; color: var(--brand); }

/* Product mockup: 실제 학습 화면 하나 */
.mock { justify-self: end; width: 100%; max-width: 600px; }
.mock-window { display: block; width: 100%; padding: 0; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 32px 64px -32px rgba(15, 23, 42, .22); transition: box-shadow .2s, border-color .2s; }
.mock-window:hover { border-color: var(--brand-200); }
.mock-bar { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #FBFCFE; }
.mock-dots { display: flex; gap: 6px; }
.mock-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); opacity: .7; }
.mock-crumb { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.mock-crumb svg.i { width: 13px; height: 13px; color: var(--line-strong); }
.mock-crumb b { color: var(--text); font-weight: 600; }
.mock-body { display: grid; grid-template-columns: 236px 1fr; }
.mock-stage { background: var(--subtle); padding: 28px 24px; display: grid; place-items: center; border-right: 1px solid var(--line); }
.phone { position: relative; width: 184px; background: #0F172A; border-radius: 28px; padding: 7px; box-shadow: 0 16px 32px -16px rgba(15, 23, 42, .35); }
.phone::before { content: ""; position: absolute; top: 12px; left: 50%; width: 44px; height: 5px; margin-left: -22px; border-radius: 999px; background: #1E293B; z-index: 2; }
.phone-screen { position: relative; border-radius: 22px; overflow: hidden; background: #fff; padding-top: 20px; }
.phone-screen img { width: 100%; display: block; }
.pw { position: relative; }
.focus-ring { position: absolute; left: 9%; right: 9%; top: 50%; height: 24%; border: 2px solid var(--brand); border-radius: 8px; background: rgba(79, 70, 229, .08); box-shadow: 0 0 0 4px rgba(79, 70, 229, .14); }
.focus-ring b { position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.mock-main { padding: 24px; display: flex; flex-direction: column; gap: 16px; font-size: 14px; }
.mock-title { font-weight: 700; font-size: 17px; letter-spacing: -0.025em; line-height: 1.35; }
.mock-prog { display: grid; gap: 8px; }
.mock-prog .bar { height: 6px; background: var(--subtle); border-radius: 999px; overflow: hidden; }
.mock-prog .bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.mock-prog small { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; }
.mock-step { display: grid; gap: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
.mock-step .no { display: inline-flex; align-items: center; gap: 8px; color: var(--brand); font-weight: 600; font-size: 13px; }
.mock-step .no i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 12px; }
.mock-step b { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
.mock-step p { color: var(--muted); line-height: 1.6; }
.mock-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-top: auto; }
.mock-actions span { display: grid; place-items: center; border-radius: 8px; height: 40px; font-weight: 600; font-size: 14px; }
.mock-actions .a1 { border: 1px solid var(--line-strong); color: var(--text); }
.mock-actions .a2 { background: var(--brand); color: #fff; }
.mock-caption { margin-top: 14px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: center; }
.mock-caption svg.i { width: 16px; height: 16px; }
@media (max-width: 1100px) { .hero-grid { gap: 48px; } .mock-body { grid-template-columns: 196px 1fr; } .phone { width: 152px; } }
@media (max-width: 1023px) {
  .hero { padding-top: 56px; }
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  .mock { justify-self: start; max-width: 640px; }
}
@media (max-width: 600px) {
  .hero { padding-top: 36px; }
  .hero-badge { margin-bottom: 20px; }
  .hero .lead { margin-bottom: 28px; }
  .hero-cta .btn { flex: 1 1 100%; }
  .mock-body { grid-template-columns: 1fr; }
  .mock-stage { border-right: 0; border-bottom: 1px solid var(--line); padding: 24px; }
  .mock-step p { display: none; }
}

/* ── Feature cards ── */
.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.feature { display: flex; flex-direction: column; gap: 16px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow-sm); cursor: pointer; }
.feature-top { display: grid; gap: 10px; }
.feature h3 { font-size: 1.12em; font-weight: 700; }
.feature-top p { color: var(--muted); font-size: .92em; line-height: 1.6; }
.feature-preview { border: 1px solid var(--line); background: #FBFCFE; border-radius: 10px; padding: 12px; display: grid; gap: 6px; font-size: .84em; flex: 1; align-content: start; }
.fp-search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--muted); }
.fp-search svg.i { width: 14px; height: 14px; }
.fp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.fp-chips span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--text); font-weight: 500; }
.fp-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.fp-row .ichip.sm { width: 26px; height: 26px; border-radius: 7px; }
.fp-row .ichip.sm svg.i { width: 14px; height: 14px; }
.fp-row b { font-weight: 500; flex: 1; }
.fp-row small { color: var(--muted); font-size: .92em; }
.feature .link { margin-top: auto; }
@media (max-width: 1023px) { .features { grid-template-columns: 1fr 1fr; } }
@media (max-width: 680px) { .features { grid-template-columns: 1fr; } }

/* ── How it works ── */
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.steps3 li { list-style: none; padding: 24px; display: grid; gap: 8px; align-content: start; }
.steps3 li + li { border-left: 1px solid var(--line); }
.steps3 .n { font-size: .8em; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.steps3 b { font-size: 1.06em; font-weight: 700; letter-spacing: -0.02em; }
.steps3 p { color: var(--muted); font-size: .92em; }
ol.steps3 { margin: 0; padding: 0; }
@media (max-width: 767px) { .steps3 { grid-template-columns: 1fr; } .steps3 li + li { border-left: 0; border-top: 1px solid var(--line); } }

/* ── Guide cards / lists ── */
.ggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ggrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1023px) { .ggrid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .ggrid, .ggrid.three { grid-template-columns: 1fr; } }
.gcard { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow-sm); min-height: 84px; }
.gcard .t { display: block; font-weight: 600; letter-spacing: -0.02em; line-height: 1.4; }
.gcard .m { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: .86em; margin-top: 4px; }
.gcard .m span { display: inline-flex; align-items: center; gap: 4px; }
.gcard .m svg.i { width: 13px; height: 13px; }
.gcard .go { color: var(--line-strong); }
.gcard .go svg.i { transition: transform .15s; }
.gcard:hover .go { color: var(--brand); }
.done { display: inline-flex; align-items: center; gap: 3px; font-size: .74em; color: var(--good); background: var(--good-50); border: 1px solid var(--good-200); border-radius: 999px; padding: 0 8px; font-weight: 600; vertical-align: 2px; margin-left: 6px; white-space: nowrap; }
.done svg.i { width: 12px; height: 12px; }

.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1023px) { .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .cats { grid-template-columns: 1fr; } }
.cat-card { display: flex; flex-direction: column; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow-sm); }
.cat-card .top { display: flex; align-items: center; justify-content: space-between; }
.cat-card h3 { font-size: 1.12em; font-weight: 700; }
.cat-card .desc { color: var(--muted); font-size: .9em; margin-top: -6px; }
.cat-card ul { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: .88em; }

/* ── Search ── */

#search-out:not(:empty) { margin-top: 20px; }
.result-head { font-size: .86em; color: var(--muted); margin-bottom: 10px; }
.sits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.sit { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-height: 68px; font-weight: 500; line-height: 1.4; box-shadow: var(--shadow-sm); }
.ai { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow-sm); display: grid; gap: 12px; }

.ai .btn { justify-self: start; }

/* ── Guide page ── */
.guide-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
@media (max-width: 1023px) { .guide-layout { grid-template-columns: 1fr; gap: 24px; } }
.g-head { display: grid; gap: 12px; margin-bottom: 24px; }
.g-head h1 { font-size: 2em; font-weight: 700; letter-spacing: -0.03em; }
.g-head .lead { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.prog { display: grid; gap: 6px; flex: 1; min-width: 200px; max-width: 360px; }
.prog .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }

.shot .zoom { position: absolute; right: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 4px; background: rgba(17, 24, 39, .78); color: #fff; font-size: .74em; font-weight: 500; border-radius: 999px; padding: 4px 10px; }

.step .body { padding: 24px 28px 28px; display: grid; gap: 12px; }

.stepno b { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 8px; background: var(--brand); color: #fff; font-size: .95em; }

.callout { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-50); border: 1px solid #BAE6FD; color: #0C4A6E; border-radius: 10px; padding: 12px 14px; font-size: .94em; }

.nav-row { display: grid; grid-template-columns: auto 1fr 1.6fr; gap: 10px; margin-top: 16px; position: sticky; bottom: 0; z-index: 10; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: rgba(248, 250, 252, .94); backdrop-filter: blur(10px); }

@media (max-width: 767px) {

}

.side { display: grid; gap: 16px; position: sticky; top: 88px; }

.fb { margin-top: 32px; }

.msg { display: flex; gap: 10px; align-items: flex-start; border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: .94em; }
.msg.ok { background: var(--good-50); border: 1px solid var(--good-200); color: #14532D; }

.contact { display: flex; gap: 14px; align-items: flex-start; }

/* ── Survey / admin ── */
.q { padding: 18px 0; border-top: 1px solid var(--line); }

/* ── Motion: 이해를 돕는 움직임만, 천천히 한 번. 기기 '동작 줄이기' 또는 페이지 '움직임 줄이기'면 끔 ── */
@keyframes pageIn { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slideNext { from { opacity: .4; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slidePrev { from { opacity: .4; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: .3; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

  :root:not([data-motion="reduce"]) #app.anim-in > * + * { animation-delay: .04s; }
  :root:not([data-motion="reduce"]) .step.slide-next { animation: slideNext .3s ease-out both; }
  :root:not([data-motion="reduce"]) .step.slide-prev { animation: slidePrev .3s ease-out both; }
  :root:not([data-motion="reduce"]) .prog .bar i { transition: width .45s ease-out; }
}

:root { --ring: 0 0 0 1px rgba(15, 23, 42, .06); --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05); --shadow-md: 0 1px 2px rgba(15, 23, 42, .05), 0 12px 32px -12px rgba(15, 23, 42, .14); }

/* ───────── 저장소: 공유 저장(db) → 안 되면 이 기기에 보관 ───────── */
const Remote = {
  db: null, uid: null, ready: false,
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.db = db; this.uid = String(uid); this.ready = true;
    } catch (e) { this.ready = false; }
  },
  async load() {
    if (!this.ready) return null;
    const snap = await this.db.doc("feedback/" + this.uid).get();
    return snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
  },
  writing: Promise.resolve(),
  async save(mutator) {
    if (!this.ready) throw new Error("no-remote");
    const run = async () => {
      const cur = (await this.load()) || { results: {}, requests: [], surveys: [] };
      mutator(cur);
      cur.updatedAt = new Date().toISOString();
      await this.db.doc("feedback/" + this.uid).set(cur);
    };
    this.writing = this.writing.then(run, run);
    return this.writing;
  }
};
async function record(kind, payload) {
  const entry = Object.assign({ at: new Date().toISOString() }, payload);
  const local = store.get("records", { results: {}, requests: [], surveys: [] });
  const apply = d => {
    d.results = d.results || {}; d.requests = d.requests || []; d.surveys = d.surveys || [];
    if (kind === "result") d.results[payload.guide] = entry;
    if (kind === "request") d.requests.push(entry);
    if (kind === "survey") d.surveys.push(entry);
  };
  apply(local); store.set("records", local);
  try { await Remote.save(apply); return "shared"; } catch (e) { return "local"; }
}

const norm = s => String(s).toLowerCase().replace(/[\s\-_·.,!?~()]/g, "");
function search(q) {
  const nq = norm(q); if (!nq) return [];
  const toks = String(q).toLowerCase().split(/\s+/).map(norm).filter(t => t.length >= 2);
  const stop = ["어떻게", "하나요", "해야", "싶어요", "안돼요", "안되요", "모르겠어요", "방법", "알려주세요", "하는법", "해요"];
  const useful = toks.filter(t => !stop.includes(t));
  return GUIDES.map(g => {
    let score = 0;
    const title = norm(g.title), short = norm(g.short);
    const body = norm(g.steps.map(s => s.t + s.d).join(" "));
    if (title.includes(nq)) score += 12;
    g.keywords.forEach(k => { const nk = norm(k); if (nq.includes(nk)) score += 6 + nk.length * 0.2; });
    useful.forEach(t => {
      if (title.includes(t)) score += 4;
      if (short.includes(t)) score += 2;
      if (g.keywords.some(k => norm(k).includes(t))) score += 3;
      if (body.includes(t)) score += 1;
    });
    return { g, score };
  }).filter(r => r.score >= 3).sort((a, b) => b.score - a.score).slice(0, 6).map(r => r.g);
}

function rollEmblem() {
  const box = $("#hero-roll"); if (!box || !box.animate || reduceMotion()) { box?.remove(); return; }
  const hero = box.parentElement, h1 = hero.querySelector("h1"), color = box.querySelector(".c");
  const hr = hero.getBoundingClientRect(), tr = h1.getBoundingClientRect();
  const size = Math.round(Math.min(260, Math.max(130, tr.height * 1.05)));
  const W = hero.clientWidth, dist = W + size;
  hero.style.setProperty("--roll", size + "px");
  box.style.top = (tr.top - hr.top + tr.height / 2 - size / 2) + "px";
  /* 두 줄 글자가 실제로 차지하는 가로 범위 */
  let L = Infinity, R = -Infinity;
  h1.querySelectorAll(".kl").forEach(el => [...el.children].forEach(c => { const q = c.getBoundingClientRect(); L = Math.min(L, q.left - hr.left); R = Math.max(R, q.right - hr.left); }));
  const clamp = v => Math.max(0, Math.min(1, v)), f = (size * 0.6) / dist;
  const pIn = clamp(L / dist), pOut = clamp((R + size) / dist);
  const timing = { duration: 8000, delay: 1400, easing: "linear", fill: "both" };
  const turns = dist / (Math.PI * size) * 360;
  const move = box.animate([
    { transform: `translateX(${-size}px) rotate(0deg)` },
    { transform: `translateX(${W}px) rotate(${turns}deg)` }
  ], timing);
  /* 글자 뒤를 지날 때는 살짝 흐리게(글자가 잘 읽히도록) */
  const DIM = 0.32;
  const op = [{ offset: 0, opacity: 1 }];
  if (pIn - f > 0) op.push({ offset: pIn - f, opacity: 1 });
  op.push({ offset: clamp(pIn + f), opacity: DIM });
  if (pOut - f > clamp(pIn + f)) op.push({ offset: pOut - f, opacity: DIM });
  if (pOut + f < 1) op.push({ offset: pOut + f, opacity: 1 });
  op.push({ offset: 1, opacity: op[op.length - 1].opacity });
  box.animate(op.sort((a, b) => a.offset - b.offset), timing);
  /* 검정 → 컬러: 글자 뒤로 들어갈 때 시작해서 빠져나올 때 완성 */
  const cs = clamp(pIn - f * 0.5), ce = Math.max(cs + 0.01, clamp(pOut - f * 0.5));
  color.animate([
    { offset: 0, opacity: 0 }, { offset: cs, opacity: 0 }, { offset: ce, opacity: 1 }, { offset: 1, opacity: 1 }
  ], timing);
  move.onfinish = () => box.remove();
}

const reduceMotion = () => document.documentElement.dataset.motion === "reduce" || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let demoTimers = [];
function demoScene(k, finalState, dur) {
  const d = $("#demo"); if (!d) return;
  d.querySelectorAll(".scene").forEach(x => x.classList.toggle("on", +x.dataset.s === k));
  d.querySelectorAll("[data-scene]").forEach(b => {
    const j = +b.dataset.scene, bar = b.querySelector(".sc-prog b");
    b.setAttribute("aria-current", j === k ? "true" : "false");
    if (!bar) return;
    bar.style.transition = "none";
    bar.style.width = j < k ? "100%" : (j === k && (finalState || !dur)) ? "100%" : "0%";
    if (j === k && dur && !finalState) { void bar.offsetWidth; bar.style.transition = `width ${dur}ms linear`; bar.style.width = "100%"; }
  });
  d.querySelectorAll(".sc-nav[data-nav]").forEach(n => n.classList.toggle("on", +n.dataset.nav === (k === 0 ? 0 : 1)));
  if (finalState) {
    if (k === 0) { $("#d-typed").textContent = "의무교육"; $("#d-result").classList.remove("hide"); $("#d-result").classList.add("hl"); }
    if (k === 1) { $("#d-bar").style.width = "21%"; $("#d-count").textContent = "3 / 14단계"; $("#d-no").textContent = "3단계"; $("#d-title").textContent = "학번과 비밀번호를 넣으세요"; }
    if (k === 2) { $("#d-thanks").classList.remove("hide"); }
  }
}
function playDemo() {
  demoTimers.forEach(clearTimeout); demoTimers = [];
  if (!$("#demo")) return;
  const at = (ms, fn) => demoTimers.push(setTimeout(() => { if ($("#demo")) fn(); }, ms));
  $("#d-typed").textContent = ""; $("#d-result").classList.add("hide"); $("#d-result").classList.remove("hl");
  $("#d-bar").style.width = "7%"; $("#d-count").textContent = "1 / 14단계"; $("#d-no").textContent = "1단계"; $("#d-title").textContent = "카카오톡 단체방의 링크를 누르세요";
  $("#d-thanks").classList.add("hide");
  demoScene(0, false, 2100);
  "의무교육".split("").forEach((ch, k) => at(250 + k * 180, () => { $("#d-typed").textContent += ch; }));
  at(1150, () => $("#d-result").classList.remove("hide"));
  at(1550, () => $("#d-result").classList.add("hl"));
  at(2100, () => demoScene(1, false, 1600));
  at(2500, () => { $("#d-bar").style.width = "21%"; $("#d-count").textContent = "3 / 14단계"; });
  at(2700, () => { $("#d-no").textContent = "3단계"; $("#d-title").textContent = "학번과 비밀번호를 넣으세요"; });
  at(3300, () => { const n = $("#d-next"); n.classList.remove("press"); void n.offsetWidth; n.classList.add("press"); });
  at(3700, () => demoScene(2, false, 1300));
  at(4300, () => { const y = $("#d-yes"); y.classList.remove("press"); void y.offsetWidth; y.classList.add("press"); });
  at(4600, () => $("#d-thanks").classList.remove("hide"));
}
function setupDemo() {
  const d = $("#demo"); if (!d) return;
  d.querySelectorAll("[data-scene]").forEach(b => b.addEventListener("click", () => { demoTimers.forEach(clearTimeout); demoScene(+b.dataset.scene, true); }));
  $("#demo-replay").addEventListener("click", () => { if (reduceMotion()) { demoScene(0, true); return; } playDemo(); });
  if (reduceMotion()) { demoScene(0, true); return; }
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); playDemo(); } }, { threshold: 0.5 });
    io.observe(d);
  } else playDemo();
}

function openGuide(id, step) {
  const g = G[id]; if (!g) return renderStart();
  state.guide = g;
  /* 안내를 새로 열면 항상 1단계부터 시작해요. 지난번 위치(pos:)는 저장만 해 두고 '이어서 보기' 버튼으로 제안해요. */
  const saved = Math.min(store.get("pos:" + id, 0), g.steps.length - 1);

function adminHtml(docs, source) {
  const per = Object.fromEntries(GUIDES.map(g => [g.id, { yes: 0, no: 0, steps: {}, comments: [] }]));
  const requests = [], surveys = [];
  docs.forEach(d => {
    Object.values(d.results || {}).forEach(r => {
      const p = per[r.guide]; if (!p) return;
      if (r.solved) p.yes++; else { p.no++; if (r.stuckStep) p.steps[r.stuckStep] = (p.steps[r.stuckStep] || 0) + 1; if (r.comment) p.comments.push(r); }
    });
    (d.requests || []).forEach(r => requests.push(r));
    (d.surveys || []).forEach(s => surveys.push(s));
  });
  const totalYes = Object.values(per).reduce((a, p) => a + p.yes, 0);
  const totalNo = Object.values(per).reduce((a, p) => a + p.no, 0);
  const rate = totalYes + totalNo ? Math.round(totalYes / (totalYes + totalNo) * 100) + "%" : "–";
  const terms = {};
  surveys.forEach(s => { (terms[s.term] = terms[s.term] || []).push(s); });
  const termRows = Object.entries(terms).sort().map(([t, list]) => {
    const avg = CONFIG.surveyQuestions.map((_, k) => (list.reduce((a, s) => a + (s.answers?.[k] || 0), 0) / list.length).toFixed(1));
    return `<tr><td>${esc(t)}</td><td class="num">${list.length}명</td>${avg.map(a => `<td class="num">${a}</td>`).join("")}</tr>`;
  }).join("");
  const rows = GUIDES.map(g => ({ g, p: per[g.id] })).sort((a, b) => (b.p.no - a.p.no) || (b.p.yes - a.p.yes)).map(({ g, p }) => {
    const tot = p.yes + p.no;
    const top = Object.entries(p.steps).sort((a, b) => b[1] - a[1])[0];
    return `<tr><td>${esc(g.title)}</td>
      <td class="num"><span class="bar" style="width:${Math.min(48, p.yes * 8)}px"></span>${p.yes}</td>
      <td class="num"><span class="bar no" style="width:${Math.min(48, p.no * 8)}px"></span>${p.no}</td>
      <td>${top ? `<span class="flag">${top[0]}단계</span> (${top[1]}명)` : "–"}</td>
      <td class="num">${tot ? Math.round(p.yes / tot * 100) + "%" : "–"}</td></tr>`;
  }).join("");
  const comments = GUIDES.flatMap(g => per[g.id].comments.map(c => ({ g, c }))).sort((a, b) => String(b.c.at).localeCompare(a.c.at)).slice(0, 50);
  return `
  <p class="small muted" style="margin-bottom:16px">기준: ${esc(source)} · 남긴 사람 ${docs.length}명</p>
  <div class="tiles">
    <div class="tile"><span>해결됐어요</span><b>${totalYes}</b></div>
    <div class="tile"><span>아직 안 돼요</span><b>${totalNo}</b></div>
    <div class="tile"><span>혼자 해결한 비율</span><b>${rate}</b></div>
    <div class="tile"><span>요청 / 설문</span><b>${requests.length} / ${surveys.length}</b></div>
  </div>
  <section class="section"><div class="section-head"><div><h2>안내별 결과</h2><p>'아직 안 돼요'가 많은 안내가 위에 와요. 붉은 글씨 단계부터 사진과 설명을 고치세요.</p></div></div>
  <div class="tbl"><table><thead><tr><th>안내</th><th class="num">해결</th><th class="num">미해결</th><th>가장 많이 막힌 곳</th><th class="num">해결률</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="section two">
    <div><div class="section-head"><h2>학생이 남긴 상황 설명</h2></div>
    ${comments.length ? `<div class="stack">${comments.map(({ g, c }) => `<div class="card small"><strong>${esc(g.title)}</strong>${c.stuckStep ? ` · ${c.stuckStep}단계` : ""}<p style="margin-top:4px">${esc(c.comment)}</p><p class="muted" style="margin-top:4px">${esc(String(c.at).slice(0, 10))}</p></div>`).join("")}</div>` : '<p class="muted">아직 없어요.</p>'}</div>
    <div><div class="section-head"><h2>새 안내 요청</h2></div>
    ${requests.length ? `<div class="stack">${requests.sort((a, b) => String(b.at).localeCompare(a.at)).map(r => `<div class="card small"><p>${esc(r.text)}</p><p class="muted" style="margin-top:4px">${esc([r.from || "안내 요청", r.topic, r.device || (r.from ? "" : "기기 미선택")].filter(Boolean).join(" · "))} · ${esc(String(r.at).slice(0, 10))}</p></div>`).join("")}</div>` : '<p class="muted">아직 없어요.</p>'}</div>
  </section>
  <section class="section"><div class="section-head"><div><h2>학기별 만족도</h2><p>5점 만점</p></div></div>
  ${termRows ? `<div class="tbl"><table><thead><tr><th>학기</th><th class="num">응답</th>${CONFIG.surveyQuestions.map((q, k) => `<th class="num" title="${esc(q)}">${k + 1}번</th>`).join("")}</tr></thead><tbody>${termRows}</tbody></table></div>
  <ol class="small muted" style="margin-top:10px">${CONFIG.surveyQuestions.map(q => `<li>${esc(q)}</li>`).join("")}</ol>` : '<p class="muted">아직 없어요.</p>'}</section>
  <section class="section two">
    <div class="card stack"><h2>새 안내를 더하는 순서</h2>
    <ol class="howto">
      <li>수업·상담에서 막힌 일을 기록하고, 여러 명이 겪었거나 신청 기간이 다가오는 것부터 고릅니다.</li>
      <li>휴대폰이나 컴퓨터 화면을 단계마다 캡처합니다. 학번·이름·연락처가 보이면 가립니다.</li>
      <li>AI(Claude)에게 캡처와 설명을 주고 같은 틀(제목·준비물·단계·이럴 땐·자주 막히는 곳)과 아래 기준으로 정리를 부탁합니다.</li>
      <li>학생 1~2명이 직접 따라 해 보고, 막힌 곳을 고친 뒤 게시합니다.</li>
      <li>새 소식에 추가 내용을 적고, 한 학기 뒤 이 화면의 결과를 보며 다시 고칩니다.</li>
    </ol></div>
    <div class="card stack"><h2>디자인·말투 기준</h2>
    <div class="tm-grid">
      <div><h3>디자인</h3><ul class="tm"><li>밝은 회백 바탕(#F8FAFC)과 흰 카드, 얇은 경계선(#E2E8F0)</li><li>인디고(#4F46E5)는 주요 버튼과 현재 위치에만, 스카이(#0EA5E9)는 '이럴 땐' 도움말에만</li><li>Pretendard 계열 산세리프, 제목은 굵게, 본문 17px 이상</li><li>모서리 10~14px, 그림자 최소, 그라데이션·이모지·장식 그림 쓰지 않음</li><li>아이콘은 같은 굵기의 선형 아이콘</li></ul>
        <div class="swatches" style="margin-top:10px"><i style="background:#F8FAFC"></i><i style="background:#111827"></i><i style="background:#4F46E5"></i><i style="background:#0EA5E9"></i><i style="background:#64748B"></i><i style="background:#E2E8F0"></i></div></div>
      <div><h3>말투</h3><ul class="tm"><li>해요체. 동작은 "~하세요", 설명은 "~해요"</li><li>한 문장에 동작 하나</li><li>화면에 보이는 글자는 따옴표로 그대로</li><li>'버튼', '누르세요'로 용어 통일</li><li>낮춤말과 전문용어 쓰지 않음</li><li>막히는 것은 학생 탓이 아니라고 느끼게</li></ul></div>
    </div></div>
  </section>`;
}

/* ───────── AI 도우미 ───────── */
function setupAI() {
  const wrap = $("#ai-wrap"); if (!wrap) return;
  wrap.hidden = false;
  $("#ai-q").addEventListener("input", () => { $("#ai-out").innerHTML = ""; });
  $("#ai-go").addEventListener("click", async () => {
    const q = $("#ai-q").value.trim();
    if (!q) { $("#ai-out").innerHTML = '<p class="err">어떤 일이 어려운지 먼저 적어 주세요.</p>'; return; }
    $("#ai-go").disabled = true;
    $("#ai-out").innerHTML = '<div class="ai-answer muted" role="status">알맞은 안내를 찾고 있어요…</div>';
    const catalog = GUIDES.map(g => `${g.id} | ${g.title} | ${g.short} | 단계: ${g.steps.map(s => s.t).join(" / ")}`).join("\n");
    const prompt = `당신은 연성대학교 사회복지경영과 성인학습자(주로 40~70대)를 돕는 디지털 도우미입니다. 차분하고 존중하는 말투로 답합니다.
학생의 질문을 읽고, 아래 안내 목록 중 도움이 되는 안내를 최대 3개 고르세요.
규칙:
- answer: 해요체 2~4문장. 먼저 공감 한마디, 그다음 무엇을 하면 되는지. 쉬운 우리말, 전문용어와 낮춤말 금지.
- 안내 목록에 없는 학교 정보(날짜, 연락처, 규정)는 지어내지 말고, 모르면 학과 사무실에 물어보라고 하세요.
- 비밀번호, 학번, 주민번호 같은 개인정보를 적어 달라고 하지 마세요.
- guides: 안내 id 배열(목록에 있는 id만).
JSON으로만 답하세요: {"answer": "...", "guides": ["id", ...]}

[안내 목록]
${catalog}

[학생 질문]
${q.slice(0, 600)}`;
    try {
      let out;
      if (typeof AI.json === "function") out = await AI.json(prompt, { modelTier: "quick" });
      else { const r = await AI(prompt, { modelTier: "quick" }); out = JSON.parse((r.text.match(/\{[\s\S]*\}/) || ["{}"])[0]); }
      const ids = (out.guides || []).filter(id => G[id]).slice(0, 3);
      $("#ai-out").innerHTML = `<div class="ai-answer"><p>${esc(out.answer || "알맞은 안내를 골라 보았어요.")}</p>
        ${ids.length ? `<div class="ggrid" style="margin-top:12px">${ids.map(id => guideItem(G[id])).join("")}</div>` : ""}
        <p class="small muted" style="margin-top:10px">AI 답변은 틀릴 수 있어요. 맞지 않으면 학과 사무실에 물어보세요.</p></div>`;
    } catch (e) {
      const msg = e && e.code === "rate_limited" ? "질문이 많아 잠시 쉬고 있어요. 1분 뒤에 다시 눌러 주세요." : "지금은 AI 도우미를 쓸 수 없어요. 위 검색칸을 이용해 주세요.";
      $("#ai-out").innerHTML = `<div class="msg warn">${ic("info")}<span>${msg}</span></div>`;
      if (e && e.code === "not_granted") $("#ai-wrap").hidden = true;
    } finally { $("#ai-go").disabled = false; }
  });
}

/* ───────── 이동(주소 #이름) ───────── */
let skipPageAnim = false;
function animatePage() {
  if (skipPageAnim) { skipPageAnim = false; return; }
  app.classList.remove("anim-in"); void app.offsetWidth; app.classList.add("anim-in");
}
function route() {
  stopSpeak(); demoTimers.forEach(clearTimeout);
  setTimeout(animatePage, 0);
  const h = location.hash.replace("#", "");
  const section = h.startsWith("soon-") ? "home" : h.startsWith("g-") || h.startsWith("cat-") ? "topics" : ["request", "survey", "news"].includes(h) ? "help" : (h || "home");
  document.body.dataset.view = h.startsWith("g-") ? "guide" : (h || "start");
  document.querySelectorAll(".tabbar [data-go], .mainnav [data-go]").forEach(b => b.setAttribute("aria-current", b.dataset.go === section ? "page" : "false"));
  if (h.startsWith("g-")) return openGuide(h.slice(2));
  if (h.startsWith("cat-")) return renderCat(h.slice(4));
  if (h.startsWith("soon-")) return renderSoon(h.slice(5));
  if (h === "find") return renderFind();
  if (h === "topics") return renderTopics();
  if (h === "help") return renderHelp();
  if (h === "request") return renderRequest();
  if (h === "survey") return renderSurvey();
  if (h === "news") return renderNews();
  if (h === "admin") return renderAdmin();
  renderStart();
}
function nav(hash) {
  if (location.hash === "#" + hash || (!hash && !location.hash)) route();
  else location.hash = hash;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

document.addEventListener("click", e => {
  const g = e.target.closest("[data-guide]");
  if (g) { e.preventDefault(); nav("g-" + g.dataset.guide); return; }
  const t = e.target.closest("[data-go]");
  if (t) { e.preventDefault(); nav(t.dataset.go === "home" ? "" : t.dataset.go); return; }
  const sc = e.target.closest("[data-scroll]");
  if (sc) { e.preventDefault(); document.getElementById(sc.dataset.scroll)?.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" }); return; }
  const z = e.target.closest("[data-zoom]");
  if (z) { $("#lightbox-img").src = z.dataset.zoom; $("#lightbox").classList.add("open"); $("#lightbox-close").focus(); }
});
document.addEventListener("click", e => {
  const tp = $("#toc-pop");
  if (tp && tp.open && !tp.contains(e.target)) tp.open = false;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeLb(); const tp = $("#toc-pop"); if (tp) tp.open = false; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="link"][data-go]')) { e.preventDefault(); e.target.click(); return; }
  if (state.guide && location.hash.startsWith("#g-") && state.mode === "one" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  }
});
$("#home-btn").addEventListener("click", () => nav(""));
const closeLb = () => $("#lightbox").classList.remove("open");
$("#lightbox").addEventListener("click", closeLb);

/* 글자 크기 */
function setFs(v) {
  document.documentElement.dataset.fs = v; store.set("fs", v);
  document.querySelectorAll(".fs .seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.fs === String(v)));
}
document.querySelectorAll(".fs .seg button").forEach(b => b.addEventListener("click", () => setFs(b.dataset.fs)));
setFs(store.get("fs", "1"));
function setMotion(reduce) {
  if (reduce) document.documentElement.dataset.motion = "reduce"; else delete document.documentElement.dataset.motion;
  store.set("motion", reduce ? "reduce" : "full");
  const t = $("#motion-toggle"); if (t) { t.setAttribute("aria-pressed", reduce ? "true" : "false"); t.textContent = reduce ? "움직임 줄이기: 켜짐" : "움직임 줄이기"; }
}
setMotion(store.get("motion", "full") === "reduce");
$("#motion-toggle").addEventListener("click", () => setMotion(document.documentElement.dataset.motion !== "reduce"));
$("#foot-updated").textContent = `안내 ${GUIDES.length}개 · ${CONFIG.updated} 수정`;

route();

/* 공유 저장소와 AI는 준비되는 대로 켭니다 */
(async () => {
  await Remote.init();
  try {
    if (window.claude && window.claude.use) {
      AI = await window.claude.use("sample");
      if (AI && location.hash === "#find") setupAI();
    }
  } catch (e) { AI = null; }
  if (location.hash === "#admin") renderAdmin();
})();
</script>
</body>
</html>
